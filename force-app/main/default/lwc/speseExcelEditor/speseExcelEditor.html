<template>
    <!-- Spinner durante la validazione / paste -->
    <template if:true={isValidating}>
        <div class="slds-modal slds-fade-in-open slds-modal_large" role="dialog" tabindex="-1">
            <div class="slds-modal__container">
                <div class="slds-modal__content slds-p-around_large slds-text-align_center">
                    <lightning-spinner alternative-text="Validazione in corso..." size="large"></lightning-spinner>
                    <div class="slds-m-top_medium">
                        <h2 class="slds-text-heading_medium">Validazione in corso...</h2>
                        <p class="slds-text-body_regular slds-m-top_small">Attendere prego mentre vengono validate le celle e gli errori evidenziati.</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- Spinner durante il salvataggio -->
    <template if:true={isSaving}>
        <div class="slds-modal slds-fade-in-open slds-modal_large" role="dialog" tabindex="-1">
            <div class="slds-modal__container">
                <div class="slds-modal__content slds-p-around_large slds-text-align_center">
                    <lightning-spinner alternative-text="Salvataggio in corso..." size="large"></lightning-spinner>
                    <div class="slds-m-top_medium">
                        <h2 class="slds-text-heading_medium">Salvataggio in corso...</h2>
                        <p class="slds-text-body_regular slds-m-top_small">Attendere prego mentre vengono creati i record.</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- Risultati -->
    <template if:true={showResults}>
        <lightning-card title="Risultati Salvataggio Spese" icon-name="standard:money">
            <div class="slds-p-around_medium">
                <div class="slds-grid slds-grid_align-spread slds-m-bottom_medium">
                    <div class="slds-col">
                        <lightning-button
                            label="Nuovo Inserimento"
                            onclick={startNewEntry}
                            variant="brand"
                            icon-name="utility:add"
                        ></lightning-button>
                    </div>
                </div>

                <div class="slds-scrollable_x">
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col"><div class="slds-truncate" title="#">#</div></th>
                                <th scope="col"><div class="slds-truncate" title="Voce di Spesa">Voce di Spesa</div></th>
                                <th scope="col"><div class="slds-truncate" title="Stato">Stato</div></th>
                                <th scope="col"><div class="slds-truncate" title="Errore">Errore</div></th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={saveResults} for:item="r">
                                <tr key={r.id} class="slds-line-height_reset">
                                    <td data-label="#"> {r.rowNumber} </td>
                                    <td data-label="Voce di Spesa">
                                        <template if:true={r.isSuccess}>
                                            <a
                                                href="#"
                                                class="slds-text-link"
                                                data-spesa-id={r.spesaId}
                                                onclick={openSpesaRecord}
                                            >
                                                {r.spesaName}
                                            </a>
                                        </template>
                                        <template if:false={r.isSuccess}>
                                            <div class="slds-truncate">-</div>
                                        </template>
                                    </td>
                                    <td data-label="Stato">
                                        <template if:true={r.isSuccess}>
                                            <span class="slds-badge slds-badge_success">Successo</span>
                                        </template>
                                        <template if:false={r.isSuccess}>
                                            <span class="slds-badge slds-theme_error">Errore</span>
                                        </template>
                                    </td>
                                    <td data-label="Errore">
                                        <template if:false={r.isSuccess}>
                                            <div class="slds-truncate">{r.errorMessage}</div>
                                        </template>
                                        <template if:true={r.isSuccess}>
                                            <div class="slds-truncate">-</div>
                                        </template>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </lightning-card>
    </template>

    <!-- Editor righe -->
    <lightning-card title="Inserisci Spese Multiple" icon-name="standard:money">
        <div class="slds-p-around_medium">
            <div class="slds-grid slds-grid_align-spread slds-m-bottom_medium">
                <div class="slds-col">
                    <lightning-button
                        label="Aggiungi Riga"
                        onclick={handleAddRow}
                        variant="neutral"
                        icon-name="utility:add"
                    ></lightning-button>

                    <lightning-button
                        label="Inserisci Valori Copiati"
                        onclick={pasteFromClipboard}
                        variant="neutral"
                        icon-name="utility:paste"
                        class="slds-m-left_small"
                    ></lightning-button>

                    <lightning-button
                        label="Elimina Riga Selezionata"
                        onclick={deleteSelectedRow}
                        variant="destructive"
                        icon-name="utility:delete"
                        class="slds-m-left_small"
                        disabled={isNoRowSelected}
                    ></lightning-button>

                    <lightning-button
                        label="Elimina tutte le righe"
                        onclick={deleteAllRows}
                        variant="destructive"
                        icon-name="utility:delete"
                        class="slds-m-left_small"
                        disabled={isTableEmpty}
                    ></lightning-button>
                </div>

                <div class="slds-col slds-text-align_right">
                    <lightning-button
                        label="Salva (Crea record)"
                        onclick={handleSave}
                        variant="brand"
                        disabled={isCreatingDisabled}
                    ></lightning-button>
                </div>
            </div>

            <template if:true={rows.length}>
                <div class="excel-table-container">
                    <table class="excel-table" role="grid">
                        <thead>
                            <tr>
                                <th class="row-number-col">#</th>
                                <th>Anno</th>
                                <th>Categoria</th>
                                <th>Sottocategoria</th>
                                <th class="note-col">Note</th>
                                <th>Data</th>
                                <th>Ammontare</th>
                                <th>Stato</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={rows} for:item="row">
                                <tr key={row.rowKey} class={row.rowClass}>
                                    <td class="row-number-cell" data-rowkey={row.rowKey} onclick={selectRow}>
                                        <div class="row-number-container" title={row.errorMessage}>
                                            {row.rowNumber}
                                        </div>
                                    </td>

                                    <td>
                                        <lightning-input
                                            type="number"
                                            value={row.anno}
                                            data-rowkey={row.rowKey}
                                            data-field="anno"
                                            onchange={handleCellChange}
                                        ></lightning-input>
                                    </td>

                                    <td>
                                        <lightning-combobox
                                            value={row.categoria}
                                            options={categoriaOptions}
                                            data-rowkey={row.rowKey}
                                            data-field="categoria"
                                            onchange={handleCellChange}
                                        ></lightning-combobox>
                                    </td>

                                    <td>
                                        <lightning-combobox
                                            value={row.sottocategoria}
                                            options={row.sottocategoriaOptions}
                                            data-rowkey={row.rowKey}
                                            data-field="sottocategoria"
                                            onchange={handleCellChange}
                                        ></lightning-combobox>
                                    </td>

                                    <td class="note-col-cell">
                                        <lightning-textarea
                                            value={row.note}
                                            variant="label-hidden"
                                            data-rowkey={row.rowKey}
                                            data-field="note"
                                            onchange={handleCellChange}
                                            class="note-textarea"
                                            maxlength="32768"
                                        ></lightning-textarea>
                                    </td>

                                    <td>
                                        <lightning-input
                                            type="date"
                                            value={row.data}
                                            data-rowkey={row.rowKey}
                                            data-field="data"
                                            onchange={handleCellChange}
                                        ></lightning-input>
                                    </td>

                                    <td>
                                        <lightning-input
                                            type="number"
                                            step="0.01"
                                            value={row.ammontare}
                                            data-rowkey={row.rowKey}
                                            data-field="ammontare"
                                            onchange={handleCellChange}
                                        ></lightning-input>
                                    </td>

                                    <td>
                                        <lightning-combobox
                                            value={row.stato}
                                            options={statoOptions}
                                            data-rowkey={row.rowKey}
                                            data-field="stato"
                                            onchange={handleCellChange}
                                        ></lightning-combobox>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>
        </div>
    </lightning-card>
</template>

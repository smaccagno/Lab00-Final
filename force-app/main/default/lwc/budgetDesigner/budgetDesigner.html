<template>
    <div class="designer-root">
        <header class={versionBannerClass}>
            <div class="designer-hero-main">
                <div class="designer-hero-title">
                    <lightning-icon icon-name="utility:table" size="small" class="designer-hero-icon"></lightning-icon>
                    <h1>{versionHeadline}</h1>
                </div>
                <div class="designer-hero-selectors">
                    <lightning-combobox
                        label="Anno"
                        value={anno}
                        options={annoOptions}
                        onchange={handleAnnoChange}>
                    </lightning-combobox>
                    <lightning-combobox
                        label="Versione"
                        value={selectedVersionId}
                        options={versionOptionsWithNew}
                        onchange={handleVersionChange}
                        placeholder="— Seleziona —">
                    </lightning-combobox>
                </div>
            </div>

            <template if:true={currentVersion}>
                <div class="designer-hero-meta">
                    <span class="designer-version-badge">{currentVersion.stato}</span>
                    <template if:true={currentVersion.nome}>
                        <span class="designer-version-nome">"{currentVersion.nome}"</span>
                    </template>
                    <template if:true={currentVersion.descrizione}>
                        <span class="designer-version-desc">{currentVersion.descrizione}</span>
                    </template>
                </div>

                <div class="designer-hero-actions">
                    <template if:true={isVersionEditable}>
                        <lightning-button
                            label="Rinomina"
                            icon-name="utility:edit"
                            onclick={handleOpenRename}>
                        </lightning-button>
                        <lightning-button
                            label="Cestina"
                            icon-name="utility:delete"
                            variant="destructive-text"
                            onclick={handleOpenTrash}>
                        </lightning-button>
                        <lightning-button
                            label="Conferma Budget"
                            icon-name="utility:check"
                            variant="brand"
                            disabled={confirmBudgetDisabled}
                            onclick={handleOpenConfirmBudget}>
                        </lightning-button>
                    </template>
                </div>
            </template>

            <template if:false={currentVersion}>
                <div class="designer-hero-empty">
                    <p>Nessun budget ancora per l'anno {annoInt}.</p>
                    <lightning-button
                        label="Crea prima versione"
                        icon-name="utility:add"
                        variant="brand"
                        onclick={handleOpenCreateVersion}>
                    </lightning-button>
                </div>
            </template>
        </header>

        <template if:true={programmaBanner}>
            <div class="slds-notify slds-notify_toast slds-theme_warning" role="alert" style="margin-bottom: 0.75rem;">
                <span class="slds-m-left_x-small">{programmaBanner}</span>
            </div>
        </template>

        <div class="designer-layout">
            <!-- Stack dei due fogli nella colonna centrale -->
            <div class="designer-sheets">

            <!-- Foglio Incassi -->
            <section class="designer-sheet">
                <div class="sheet-title sheet-title--incassi">
                    <lightning-icon icon-name="utility:arrowup" size="small" variant="success"></lightning-icon>
                    <span>Incassi Previsti</span>
                    <span class="sheet-count-badge sheet-count-badge--incassi">{incassi.length}</span>
                </div>

                <template if:true={incassiCopyBanner}>
                    <div class="sheet-copy-banner">
                        <lightning-icon icon-name="utility:copy_to_clipboard" size="xx-small"></lightning-icon>
                        <span>Riga Incasso copiata — clicca <strong>Incolla</strong> sulla riga di destinazione.</span>
                        <button class="sheet-copy-banner-cancel" onclick={handleCancelCopyMode}>Annulla</button>
                    </div>
                </template>

                <div class="sheet-wrapper">
                    <table class="sheet sheet--incassi" role="grid" aria-label="Foglio Incassi Previsti">
                        <colgroup>
                            <col class="col-handle"/>
                            <col class="col-prog"/>
                            <col class="col-cat"/>
                            <col class="col-name"/>
                            <col class="col-date"/>
                            <col class="col-amount"/>
                            <col class="col-actions"/>
                        </colgroup>
                        <thead>
                            <tr>
                                <th scope="col" aria-label="Trascina"></th>
                                <th scope="col">Programma</th>
                                <th scope="col">Categoria</th>
                                <th scope="col">Titolo</th>
                                <th scope="col">Data prevista</th>
                                <th scope="col" class="col-amount">Ammontare</th>
                                <th scope="col" aria-label="Azioni"></th>
                            </tr>
                        </thead>
                            <template for:each={incassiGroups} for:item="grp">
                                <tbody key={grp.key} class="sheet-group">
                                    <tr class="sheet-group-header sheet-group-header--incassi"
                                        data-categoria={grp.categoria}
                                        data-kind="incasso"
                                        ondragover={handleRowDragOver}
                                        ondrop={handleGroupHeaderDrop}>
                                        <td class="col-handle sheet-group-handle"
                                            draggable="true"
                                            data-key={grp.key}
                                            data-kind="incasso"
                                            ondragstart={handleGroupDragStart}
                                            ondragend={handleRowDragEnd}
                                            title="Trascina per riordinare le categorie">
                                            <lightning-icon icon-name="utility:drag_and_drop" size="xx-small" alternative-text="Trascina categoria"></lightning-icon>
                                        </td>
                                        <th scope="rowgroup" colspan="4">
                                            <span class="sheet-group-name">{grp.categoriaLabel}</span>
                                            <span class="sheet-group-count">{grp.countLabel}</span>
                                        </th>
                                        <td class="col-amount sheet-group-subtotal sheet-group-subtotal--incassi">{grp.subtotalFormatted}</td>
                                        <td></td>
                                    </tr>
                                    <template for:each={grp.children} for:item="row">
                                        <template if:false={row.isEditing}>
                                            <tr key={row.id} class="sheet-row sheet-row--view sheet-row--child"
                                                data-id={row.id}
                                                data-kind="incasso"
                                                ondragover={handleRowDragOver}
                                                ondrop={handleRowDrop}>
                                                <td class="col-handle sheet-row-handle"
                                                    draggable="true"
                                                    data-id={row.id}
                                                    data-kind="incasso"
                                                    ondragstart={handleRowDragStart}
                                                    ondragend={handleRowDragEnd}
                                                    title="Trascina per riordinare">
                                                    <lightning-icon icon-name="utility:drag_and_drop" size="xx-small" alternative-text="Trascina"></lightning-icon>
                                                </td>
                                                <td class="col-prog">{row.programmaName}</td>
                                                <td>{row.categoria}</td>
                                                <td>{row.name}</td>
                                                <td>{row.data}</td>
                                                <td class="col-amount">{row.ammontareFmt}</td>
                                                <td class="col-actions">
                                                    <div class="sheet-row-actions">
                                                        <template if:true={isVersionEditable}>
                                                            <template if:true={row.showCopy}>
                                                                <button class="sheet-row-action-btn"
                                                                        title="Duplica riga (aggiunge in fondo)"
                                                                        data-id={row.id}
                                                                        data-kind="incasso"
                                                                        onclick={handleRowDuplicateInline}>
                                                                    <lightning-icon icon-name="utility:duplicate" size="xx-small" alternative-text="Duplica"></lightning-icon>
                                                                </button>
                                                                <button class="sheet-row-action-btn"
                                                                        title="Copia riga"
                                                                        data-id={row.id}
                                                                        data-kind="incasso"
                                                                        onclick={handleRowCopyInline}>
                                                                    <lightning-icon icon-name="utility:copy" size="xx-small" alternative-text="Copia"></lightning-icon>
                                                                </button>
                                                            </template>
                                                            <template if:true={row.showPaste}>
                                                                <button class="sheet-row-action-btn sheet-row-action-btn--paste"
                                                                        title="Incolla qui la riga copiata"
                                                                        data-id={row.id}
                                                                        data-kind="incasso"
                                                                        onclick={handleRowPasteInline}>
                                                                    <lightning-icon icon-name="utility:paste" size="xx-small" alternative-text="Incolla"></lightning-icon>
                                                                </button>
                                                            </template>
                                                            <button class="sheet-row-action-btn"
                                                                    title="Modifica"
                                                                    data-id={row.id}
                                                                    data-kind="incasso"
                                                                    onclick={handleRowBeginEdit}>
                                                                <lightning-icon icon-name="utility:edit" size="xx-small" alternative-text="Modifica"></lightning-icon>
                                                            </button>
                                                            <button class="sheet-row-remove"
                                                                    title="Rimuovi riga"
                                                                    data-id={row.id}
                                                                    data-kind="incasso"
                                                                    onclick={handleRowDelete}>
                                                                <lightning-icon icon-name="utility:close" size="xx-small" alternative-text="Rimuovi"></lightning-icon>
                                                            </button>
                                                        </template>
                                                        <template if:true={isVersionUfficiale}>
                                                            <button class="sheet-row-action-btn"
                                                                    title="Modifica (crea copia provvisoria)"
                                                                    data-id={row.id}
                                                                    data-kind="incasso"
                                                                    onclick={handleRowBeginEdit}>
                                                                <lightning-icon icon-name="utility:unlock" size="xx-small" alternative-text="Sblocca e modifica"></lightning-icon>
                                                            </button>
                                                        </template>
                                                    </div>
                                                </td>
                                            </tr>
                                        </template>
                                        <template if:true={row.isEditing}>
                                            <tr key={row.id} class="sheet-row sheet-row--edit sheet-row--child"
                                                data-id={row.id}
                                                data-kind="incasso">
                                                <td class="col-handle"></td>
                                                <td class="col-prog">
                                                    <select class="prog-select"
                                                        data-id={row.id}
                                                        data-field="programmaId"
                                                        onchange={handleRowCellChange}>
                                                        <template for:each={row.programmaOptions} for:item="opt">
                                                            <option key={opt.value} value={opt.value} selected={opt.selected}>{opt.label}</option>
                                                        </template>
                                                    </select>
                                                </td>
                                                <td>
                                                    <lightning-combobox
                                                        variant="label-hidden"
                                                        value={row.categoria}
                                                        options={row.categoriaOptions}
                                                        data-id={row.id}
                                                        data-field="categoria"
                                                        onchange={handleRowCellChange}>
                                                    </lightning-combobox>
                                                </td>
                                                <td>
                                                    <lightning-input
                                                        type="text"
                                                        variant="label-hidden"
                                                        value={row.name}
                                                        placeholder="Titolo"
                                                        data-id={row.id}
                                                        data-field="name"
                                                        onchange={handleRowCellChange}>
                                                    </lightning-input>
                                                </td>
                                                <td>
                                                    <lightning-input
                                                        type="date"
                                                        variant="label-hidden"
                                                        value={row.data}
                                                        data-id={row.id}
                                                        data-field="data"
                                                        onchange={handleRowCellChange}>
                                                    </lightning-input>
                                                </td>
                                                <td class="col-amount">
                                                    <lightning-input
                                                        type="number"
                                                        variant="label-hidden"
                                                        value={row.ammontare}
                                                        step="0.01"
                                                        min="0"
                                                        formatter="currency"
                                                        data-id={row.id}
                                                        data-field="ammontare"
                                                        onchange={handleRowCellChange}>
                                                    </lightning-input>
                                                </td>
                                                <td class="col-actions">
                                                    <div class="sheet-row-actions">
                                                        <button class="sheet-row-action-btn"
                                                                title="Conferma"
                                                                data-id={row.id}
                                                                data-kind="incasso"
                                                                onclick={handleRowConfirm}>
                                                            <lightning-icon icon-name="utility:check" size="xx-small" alternative-text="Conferma"></lightning-icon>
                                                        </button>
                                                        <button class="sheet-row-action-btn"
                                                                title="Annulla"
                                                                data-id={row.id}
                                                                data-kind="incasso"
                                                                onclick={handleRowCancelEdit}>
                                                            <lightning-icon icon-name="utility:undo" size="xx-small" alternative-text="Annulla"></lightning-icon>
                                                        </button>
                                                    </div>
                                                </td>
                                            </tr>
                                        </template>
                                    </template>
                                </tbody>
                            </template>

                            <template if:true={isVersionEditable}>
                                <tbody>
                                    <!-- Riga draft (solo se versione editabile) -->
                                    <tr class="sheet-row sheet-row--draft">
                                        <td class="col-handle"></td>
                                        <td class="col-prog">
                                            <select class="prog-select"
                                                data-scope="draft-incasso"
                                                data-field="programmaId"
                                                onchange={handleDraftIncassoChange}>
                                                <template for:each={draftIncassoView.programmaOptions} for:item="opt">
                                                    <option key={opt.value} value={opt.value} selected={opt.selected}>{opt.label}</option>
                                                </template>
                                            </select>
                                        </td>
                                        <td>
                                            <lightning-combobox
                                                variant="label-hidden"
                                                value={draftIncassoView.categoria}
                                                options={draftIncassoView.categoriaOptions}
                                                data-scope="draft-incasso"
                                                data-field="categoria"
                                                onchange={handleDraftIncassoChange}>
                                            </lightning-combobox>
                                        </td>
                                        <td>
                                            <lightning-input
                                                type="text"
                                                variant="label-hidden"
                                                value={draftIncassoView.name}
                                                placeholder="Titolo"
                                                data-scope="draft-incasso"
                                                data-field="name"
                                                onchange={handleDraftIncassoChange}>
                                            </lightning-input>
                                        </td>
                                        <td>
                                            <lightning-input
                                                type="date"
                                                variant="label-hidden"
                                                value={draftIncassoView.data}
                                                placeholder={dataTarget}
                                                data-scope="draft-incasso"
                                                data-field="data"
                                                onchange={handleDraftIncassoChange}>
                                            </lightning-input>
                                        </td>
                                        <td class="col-amount">
                                            <lightning-input
                                                type="number"
                                                variant="label-hidden"
                                                value={draftIncassoView.ammontare}
                                                step="0.01"
                                                min="0"
                                                placeholder="0"
                                                formatter="currency"
                                                data-scope="draft-incasso"
                                                data-field="ammontare"
                                                onchange={handleDraftIncassoChange}>
                                            </lightning-input>
                                        </td>
                                        <td class="col-actions">
                                            <div class="sheet-row-actions">
                                                <button class="sheet-row-action-btn sheet-row-action-btn--confirm"
                                                        title="Conferma riga (non svuotare il form)"
                                                        disabled={draftIncassoAddDisabled}
                                                        onclick={handleDraftIncassoConfirm}>
                                                    <lightning-icon icon-name="utility:check" size="xx-small" alternative-text="Conferma"></lightning-icon>
                                                </button>
                                                <button class="sheet-row-add"
                                                        title="Aggiungi riga e preparane un'altra"
                                                        disabled={draftIncassoAddDisabled}
                                                        onclick={handleDraftIncassoSubmit}>
                                                    <lightning-icon icon-name="utility:add" size="xx-small" alternative-text="Aggiungi"></lightning-icon>
                                                </button>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </template>
                            <tfoot>
                                <tr class="sheet-total-row">
                                    <th scope="row" colspan="5">Totale Incassi</th>
                                    <td class="col-amount sheet-total-value sheet-total-value--incassi">{totalIncassiLabel}</td>
                                    <td></td>
                                </tr>
                            </tfoot>
                    </table>
                </div>
            </section>

            <!-- Foglio Spese -->
            <section class="designer-sheet">
                <div class="sheet-title sheet-title--spese">
                    <lightning-icon icon-name="utility:arrowdown" size="small" variant="error"></lightning-icon>
                    <span>Spese Previste</span>
                    <span class="sheet-count-badge sheet-count-badge--spese">{spese.length}</span>
                </div>

                <template if:true={speseCopyBanner}>
                    <div class="sheet-copy-banner sheet-copy-banner--spese">
                        <lightning-icon icon-name="utility:copy_to_clipboard" size="xx-small"></lightning-icon>
                        <span>Riga Spesa copiata — clicca <strong>Incolla</strong> sulla riga di destinazione.</span>
                        <button class="sheet-copy-banner-cancel" onclick={handleCancelCopyMode}>Annulla</button>
                    </div>
                </template>

                <div class="sheet-wrapper">
                    <table class="sheet sheet--spese" role="grid" aria-label="Foglio Spese Previste">
                        <colgroup>
                            <col class="col-handle"/>
                            <col class="col-prog"/>
                            <col class="col-cat"/>
                            <col class="col-subcat"/>
                            <col class="col-name"/>
                            <col class="col-date"/>
                            <col class="col-amount"/>
                            <col class="col-note"/>
                            <col class="col-actions"/>
                        </colgroup>
                        <thead>
                            <tr>
                                <th scope="col" aria-label="Trascina"></th>
                                <th scope="col">Programma</th>
                                <th scope="col">Categoria</th>
                                <th scope="col">Sottocategoria</th>
                                <th scope="col">Titolo</th>
                                <th scope="col">Data prevista</th>
                                <th scope="col" class="col-amount">Ammontare</th>
                                <th scope="col">Note</th>
                                <th scope="col" aria-label="Azioni"></th>
                            </tr>
                        </thead>
                            <template for:each={speseGroups} for:item="grp">
                                <tbody key={grp.key} class="sheet-group">
                                    <tr class="sheet-group-header sheet-group-header--spese"
                                        data-categoria={grp.categoria}
                                        data-kind="spesa"
                                        ondragover={handleRowDragOver}
                                        ondrop={handleGroupHeaderDrop}>
                                        <td class="col-handle sheet-group-handle"
                                            draggable="true"
                                            data-key={grp.key}
                                            data-kind="spesa"
                                            ondragstart={handleGroupDragStart}
                                            ondragend={handleRowDragEnd}
                                            title="Trascina per riordinare le categorie">
                                            <lightning-icon icon-name="utility:drag_and_drop" size="xx-small" alternative-text="Trascina categoria"></lightning-icon>
                                        </td>
                                        <th scope="rowgroup" colspan="5">
                                            <span class="sheet-group-name">{grp.categoriaLabel}</span>
                                            <span class="sheet-group-count">{grp.countLabel}</span>
                                        </th>
                                        <td class="col-amount sheet-group-subtotal sheet-group-subtotal--spese">{grp.subtotalFormatted}</td>
                                        <td colspan="2"></td>
                                    </tr>
                                    <template for:each={grp.children} for:item="row">
                                        <template if:false={row.isEditing}>
                                            <tr key={row.id} class="sheet-row sheet-row--view sheet-row--child"
                                                data-id={row.id}
                                                data-kind="spesa"
                                                ondragover={handleRowDragOver}
                                                ondrop={handleRowDrop}>
                                                <td class="col-handle sheet-row-handle"
                                                    draggable="true"
                                                    data-id={row.id}
                                                    data-kind="spesa"
                                                    ondragstart={handleRowDragStart}
                                                    ondragend={handleRowDragEnd}
                                                    title="Trascina per riordinare">
                                                    <lightning-icon icon-name="utility:drag_and_drop" size="xx-small" alternative-text="Trascina"></lightning-icon>
                                                </td>
                                                <td class="col-prog">{row.programmaName}</td>
                                                <td>{row.categoria}</td>
                                                <td>{row.sottocategoria}</td>
                                                <td>{row.name}</td>
                                                <td>{row.data}</td>
                                                <td class="col-amount">{row.ammontareFmt}</td>
                                                <td>{row.note}</td>
                                                <td class="col-actions">
                                                    <div class="sheet-row-actions">
                                                        <template if:true={isVersionEditable}>
                                                            <template if:true={row.showCopy}>
                                                                <button class="sheet-row-action-btn"
                                                                        title="Duplica riga (aggiunge in fondo)"
                                                                        data-id={row.id}
                                                                        data-kind="spesa"
                                                                        onclick={handleRowDuplicateInline}>
                                                                    <lightning-icon icon-name="utility:duplicate" size="xx-small" alternative-text="Duplica"></lightning-icon>
                                                                </button>
                                                                <button class="sheet-row-action-btn"
                                                                        title="Copia riga"
                                                                        data-id={row.id}
                                                                        data-kind="spesa"
                                                                        onclick={handleRowCopyInline}>
                                                                    <lightning-icon icon-name="utility:copy" size="xx-small" alternative-text="Copia"></lightning-icon>
                                                                </button>
                                                            </template>
                                                            <template if:true={row.showPaste}>
                                                                <button class="sheet-row-action-btn sheet-row-action-btn--paste"
                                                                        title="Incolla qui la riga copiata"
                                                                        data-id={row.id}
                                                                        data-kind="spesa"
                                                                        onclick={handleRowPasteInline}>
                                                                    <lightning-icon icon-name="utility:paste" size="xx-small" alternative-text="Incolla"></lightning-icon>
                                                                </button>
                                                            </template>
                                                            <button class="sheet-row-action-btn"
                                                                    title="Modifica"
                                                                    data-id={row.id}
                                                                    data-kind="spesa"
                                                                    onclick={handleRowBeginEdit}>
                                                                <lightning-icon icon-name="utility:edit" size="xx-small" alternative-text="Modifica"></lightning-icon>
                                                            </button>
                                                            <button class="sheet-row-remove"
                                                                    title="Rimuovi riga"
                                                                    data-id={row.id}
                                                                    data-kind="spesa"
                                                                    onclick={handleRowDelete}>
                                                                <lightning-icon icon-name="utility:close" size="xx-small" alternative-text="Rimuovi"></lightning-icon>
                                                            </button>
                                                        </template>
                                                        <template if:true={isVersionUfficiale}>
                                                            <button class="sheet-row-action-btn"
                                                                    title="Modifica (crea copia provvisoria)"
                                                                    data-id={row.id}
                                                                    data-kind="spesa"
                                                                    onclick={handleRowBeginEdit}>
                                                                <lightning-icon icon-name="utility:unlock" size="xx-small" alternative-text="Sblocca e modifica"></lightning-icon>
                                                            </button>
                                                        </template>
                                                    </div>
                                                </td>
                                            </tr>
                                        </template>
                                        <template if:true={row.isEditing}>
                                            <tr key={row.id} class="sheet-row sheet-row--edit sheet-row--child"
                                                data-id={row.id}
                                                data-kind="spesa">
                                                <td class="col-handle"></td>
                                                <td class="col-prog">
                                                    <select class="prog-select"
                                                        data-id={row.id}
                                                        data-field="programmaId"
                                                        onchange={handleRowCellChange}>
                                                        <template for:each={row.programmaOptions} for:item="opt">
                                                            <option key={opt.value} value={opt.value} selected={opt.selected}>{opt.label}</option>
                                                        </template>
                                                    </select>
                                                </td>
                                                <td>
                                                    <lightning-combobox
                                                        variant="label-hidden"
                                                        value={row.categoria}
                                                        options={row.categoriaOptions}
                                                        data-id={row.id}
                                                        data-field="categoria"
                                                        onchange={handleRowCellChange}>
                                                    </lightning-combobox>
                                                </td>
                                                <td>
                                                    <lightning-combobox
                                                        variant="label-hidden"
                                                        value={row.sottocategoria}
                                                        options={row.subOptions}
                                                        disabled={row.subDisabled}
                                                        data-id={row.id}
                                                        data-field="sottocategoria"
                                                        onchange={handleRowCellChange}>
                                                    </lightning-combobox>
                                                </td>
                                                <td>
                                                    <lightning-input
                                                        type="text"
                                                        variant="label-hidden"
                                                        value={row.name}
                                                        placeholder="Titolo"
                                                        data-id={row.id}
                                                        data-field="name"
                                                        onchange={handleRowCellChange}>
                                                    </lightning-input>
                                                </td>
                                                <td>
                                                    <lightning-input
                                                        type="date"
                                                        variant="label-hidden"
                                                        value={row.data}
                                                        data-id={row.id}
                                                        data-field="data"
                                                        onchange={handleRowCellChange}>
                                                    </lightning-input>
                                                </td>
                                                <td class="col-amount">
                                                    <lightning-input
                                                        type="number"
                                                        variant="label-hidden"
                                                        value={row.ammontare}
                                                        step="0.01"
                                                        min="0"
                                                        formatter="currency"
                                                        data-id={row.id}
                                                        data-field="ammontare"
                                                        onchange={handleRowCellChange}>
                                                    </lightning-input>
                                                </td>
                                                <td>
                                                    <lightning-input
                                                        type="text"
                                                        variant="label-hidden"
                                                        value={row.note}
                                                        placeholder="Note"
                                                        data-id={row.id}
                                                        data-field="note"
                                                        onchange={handleRowCellChange}>
                                                    </lightning-input>
                                                </td>
                                                <td class="col-actions">
                                                    <div class="sheet-row-actions">
                                                        <button class="sheet-row-action-btn"
                                                                title="Conferma"
                                                                data-id={row.id}
                                                                data-kind="spesa"
                                                                onclick={handleRowConfirm}>
                                                            <lightning-icon icon-name="utility:check" size="xx-small" alternative-text="Conferma"></lightning-icon>
                                                        </button>
                                                        <button class="sheet-row-action-btn"
                                                                title="Annulla"
                                                                data-id={row.id}
                                                                data-kind="spesa"
                                                                onclick={handleRowCancelEdit}>
                                                            <lightning-icon icon-name="utility:undo" size="xx-small" alternative-text="Annulla"></lightning-icon>
                                                        </button>
                                                    </div>
                                                </td>
                                            </tr>
                                        </template>
                                    </template>
                                </tbody>
                            </template>

                            <template if:true={isVersionEditable}>
                                <tbody>
                                <!-- Riga draft -->
                                <tr class="sheet-row sheet-row--draft">
                                    <td class="col-handle"></td>
                                    <td class="col-prog">
                                        <select class="prog-select"
                                            data-scope="draft-spesa"
                                            data-field="programmaId"
                                            onchange={handleDraftSpesaChange}>
                                            <template for:each={draftSpesaView.programmaOptions} for:item="opt">
                                                <option key={opt.value} value={opt.value} selected={opt.selected}>{opt.label}</option>
                                            </template>
                                        </select>
                                    </td>
                                    <td>
                                        <lightning-combobox
                                            variant="label-hidden"
                                            value={draftSpesaView.categoria}
                                            options={draftSpesaView.categoriaOptions}
                                            data-scope="draft-spesa"
                                            data-field="categoria"
                                            onchange={handleDraftSpesaChange}>
                                        </lightning-combobox>
                                    </td>
                                    <td>
                                        <lightning-combobox
                                            variant="label-hidden"
                                            value={draftSpesaView.sottocategoria}
                                            options={draftSpesaView.subOptions}
                                            disabled={draftSpesaView.subDisabled}
                                            data-scope="draft-spesa"
                                            data-field="sottocategoria"
                                            onchange={handleDraftSpesaChange}>
                                        </lightning-combobox>
                                    </td>
                                    <td>
                                        <lightning-input
                                            type="text"
                                            variant="label-hidden"
                                            value={draftSpesaView.name}
                                            placeholder="Titolo"
                                            data-scope="draft-spesa"
                                            data-field="name"
                                            onchange={handleDraftSpesaChange}>
                                        </lightning-input>
                                    </td>
                                    <td>
                                        <lightning-input
                                            type="date"
                                            variant="label-hidden"
                                            value={draftSpesaView.data}
                                            placeholder={dataTarget}
                                            data-scope="draft-spesa"
                                            data-field="data"
                                            onchange={handleDraftSpesaChange}>
                                        </lightning-input>
                                    </td>
                                    <td class="col-amount">
                                        <lightning-input
                                            type="number"
                                            variant="label-hidden"
                                            value={draftSpesaView.ammontare}
                                            step="0.01"
                                            min="0"
                                            placeholder="0"
                                            formatter="currency"
                                            data-scope="draft-spesa"
                                            data-field="ammontare"
                                            onchange={handleDraftSpesaChange}>
                                        </lightning-input>
                                    </td>
                                    <td>
                                        <lightning-input
                                            type="text"
                                            variant="label-hidden"
                                            value={draftSpesaView.note}
                                            placeholder="Note"
                                            data-scope="draft-spesa"
                                            data-field="note"
                                            onchange={handleDraftSpesaChange}>
                                        </lightning-input>
                                    </td>
                                    <td class="col-actions">
                                        <div class="sheet-row-actions">
                                            <button class="sheet-row-action-btn sheet-row-action-btn--confirm"
                                                    title="Conferma riga (non svuotare il form)"
                                                    disabled={draftSpesaAddDisabled}
                                                    onclick={handleDraftSpesaConfirm}>
                                                <lightning-icon icon-name="utility:check" size="xx-small" alternative-text="Conferma"></lightning-icon>
                                            </button>
                                            <button class="sheet-row-add"
                                                    title="Aggiungi riga e preparane un'altra"
                                                    disabled={draftSpesaAddDisabled}
                                                    onclick={handleDraftSpesaSubmit}>
                                                <lightning-icon icon-name="utility:add" size="xx-small" alternative-text="Aggiungi"></lightning-icon>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                            </template>
                        <tfoot>
                            <tr class="sheet-total-row">
                                <th scope="row" colspan="6">Totale Spese</th>
                                <td class="col-amount sheet-total-value sheet-total-value--spese">{totalSpeseLabel}</td>
                                <td colspan="2"></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </section>

            </div>
            <!-- /designer-sheets -->

            <!-- Vista Omnicomprensiva -->
            <aside class="designer-overview" aria-label="Vista omnicomprensiva">
                <div class="designer-overview-inner">
                    <div class="designer-card-head">
                        <lightning-icon icon-name="utility:chart" size="x-small"></lightning-icon>
                        <h2>Vista Omnicomprensiva</h2>
                    </div>

                    <div class="kpi-stack">
                        <div class="kpi-card kpi-card--incassi">
                            <div class="kpi-label">Totale Incassi Previsti</div>
                            <div class="kpi-value kpi-value--incassi">{totalIncassiLabel}</div>
                            <div class="kpi-meta">{incassi.length} voci</div>
                        </div>
                        <div class="kpi-card kpi-card--spese">
                            <div class="kpi-label">Totale Spese Previste</div>
                            <div class="kpi-value kpi-value--spese">{totalSpeseLabel}</div>
                            <div class="kpi-meta">{spese.length} voci</div>
                        </div>
                        <div class={cashFlowCardClass}>
                            <div class="kpi-label">Saldo Previsto</div>
                            <div class={cashFlowValueClass}>{cashFlowLabel}</div>
                            <template if:true={cashFlowPositive}>
                                <div class="kpi-meta">Flusso positivo</div>
                            </template>
                            <template if:false={cashFlowPositive}>
                                <div class="kpi-meta">Flusso negativo</div>
                            </template>
                        </div>
                    </div>

                    <template if:true={incassiByCategoryBars.length}>
                        <div class="overview-block">
                            <h3>Incassi per categoria</h3>
                            <template for:each={incassiByCategoryBars} for:item="bar">
                                <div key={bar.key} class="overview-bar-row">
                                    <span class="overview-bar-label" title={bar.categoria}>{bar.categoria}</span>
                                    <span class="overview-bar-track">
                                        <span class="overview-bar-fill overview-bar-fill--incassi" style={bar.style}></span>
                                    </span>
                                    <span class="overview-bar-value">{bar.formattedTotal}</span>
                                </div>
                            </template>
                        </div>
                    </template>

                    <template if:true={speseByCategoryBars.length}>
                        <div class="overview-block">
                            <h3>Spese per categoria</h3>
                            <template for:each={speseByCategoryBars} for:item="bar">
                                <div key={bar.key} class="overview-bar-row">
                                    <span class="overview-bar-label" title={bar.categoria}>{bar.categoria}</span>
                                    <span class="overview-bar-track">
                                        <span class="overview-bar-fill overview-bar-fill--spese" style={bar.style}></span>
                                    </span>
                                    <span class="overview-bar-value">{bar.formattedTotal}</span>
                                </div>
                            </template>
                        </div>
                    </template>

                    <template if:false={hasDraftItems}>
                        <div class="overview-empty">
                            <lightning-icon icon-name="utility:chart" size="large"></lightning-icon>
                            <p>Nessuna voce ancora pianificata.</p>
                            <p class="overview-empty-hint">Aggiungi una riga per vedere il budget popolarsi qui.</p>
                        </div>
                    </template>
                </div>
            </aside>
        </div>

        <!-- ── Dialog: Crea versione ── -->
        <template if:true={showCreateVersionDialog}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="dlg-create-title" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 id="dlg-create-title" class="slds-modal__title slds-hyphenate">Crea versione</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-input label="Nome" value={dialogNome} onchange={handleDialogNomeChange}></lightning-input>
                        <lightning-textarea label="Descrizione" value={dialogDescrizione} onchange={handleDialogDescChange} class="slds-m-top_small"></lightning-textarea>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Annulla" variant="neutral" onclick={handleCancelCreateVersion}></lightning-button>
                        <lightning-button label="Crea" variant="brand" onclick={handleConfirmCreateVersion} class="slds-m-left_small"></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>

        <!-- ── Dialog: Rinomina versione ── -->
        <template if:true={showRenameVersionDialog}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="dlg-rename-title" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 id="dlg-rename-title" class="slds-modal__title slds-hyphenate">Rinomina versione</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-input label="Nome" value={dialogNome} onchange={handleDialogNomeChange}></lightning-input>
                        <lightning-textarea label="Descrizione" value={dialogDescrizione} onchange={handleDialogDescChange} class="slds-m-top_small"></lightning-textarea>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Annulla" variant="neutral" onclick={handleCancelRename}></lightning-button>
                        <lightning-button label="Salva" variant="brand" onclick={handleConfirmRename} class="slds-m-left_small"></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>

        <!-- ── Dialog: Cestina versione ── -->
        <template if:true={showTrashVersionDialog}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="dlg-trash-title" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 id="dlg-trash-title" class="slds-modal__title slds-hyphenate">Cestinare questa versione?</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <p>La versione sarà spostata nel cestino (soft delete) e non comparirà più nell'elenco.</p>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Annulla" variant="neutral" onclick={handleCancelTrash}></lightning-button>
                        <lightning-button label="Cestina" variant="destructive" onclick={handleConfirmTrash} class="slds-m-left_small"></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>

        <!-- ── Dialog: Promote ── -->
        <template if:true={showConfirmBudgetDialog}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="dlg-promote-title" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 id="dlg-promote-title" class="slds-modal__title slds-hyphenate">Promuovere a Ufficiale?</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <p>Saranno create le voci Previste per l'anno e rimosse quelle dell'eventuale versione Ufficiale precedente.</p>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Annulla" variant="neutral" onclick={handleCancelPromote}></lightning-button>
                        <lightning-button label="Conferma Budget" variant="brand" onclick={handleConfirmPromote} class="slds-m-left_small"></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>

        <!-- ── Dialog: Fork conferma ── -->
        <template if:true={showForkConfirmDialog}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="dlg-fork-title" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 id="dlg-fork-title" class="slds-modal__title slds-hyphenate">Modificare la versione Ufficiale?</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <p>Verrà creata una copia Provvisoria. Modifica la copia e poi promuovila a Ufficiale con "Conferma Budget".</p>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Annulla" variant="neutral" onclick={handleCancelFork}></lightning-button>
                        <lightning-button label="Crea copia e apri" variant="brand" onclick={handleConfirmFork} class="slds-m-left_small"></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>
    </div>
</template>

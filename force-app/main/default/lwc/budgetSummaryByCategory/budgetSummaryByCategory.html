<template>
    <lightning-card title="Riepilogo Budget per Categoria" icon-name="custom:custom41">
        <div class="slds-p-around_medium">
            
            <template if:true={error}>
                <div class="slds-text-color_error">{error}</div>
            </template>

            <template if:true={hasData}>
                <div class="chart-container">
                    
                    <!-- Incassi Section -->
                    <template if:true={incassi.length}>
                        <h3 class="slds-text-heading_small slds-m-bottom_medium slds-text-color_success">
                            <lightning-icon icon-name="utility:arrowup" size="small" variant="success" class="slds-m-right_xx-small"></lightning-icon>
                            Incassi
                        </h3>
                        
                        <template for:each={incassi} for:item="item">
                            <div key={item.categoria} class="bar-row">
                                <div class="bar-label" title={item.categoria}>{item.categoria}</div>
                                <div class="bar-track">
                                    <div class={item.barClass} style={item.widthStyle}></div>
                                </div>
                                <div class="bar-value">
                                    <lightning-formatted-number value={item.totale} format-style="currency" currency-code="EUR"></lightning-formatted-number>
                                </div>
                            </div>
                        </template>
                    </template>

                    <!-- Spese Section -->
                    <template if:true={spese.length}>
                        <h3 class="slds-text-heading_small slds-m-top_large slds-m-bottom_medium slds-text-color_error">
                            <lightning-icon icon-name="utility:arrowdown" size="small" variant="error" class="slds-m-right_xx-small"></lightning-icon>
                            Spese
                        </h3>
                        
                        <template for:each={spese} for:item="item">
                            <div key={item.categoria} class="bar-row">
                                <div class="bar-label" title={item.categoria}>{item.categoria}</div>
                                <div class="bar-track">
                                    <div class={item.barClass} style={item.widthStyle}></div>
                                </div>
                                <div class="bar-value">
                                    <lightning-formatted-number value={item.totale} format-style="currency" currency-code="EUR"></lightning-formatted-number>
                                </div>
                            </div>
                        </template>
                    </template>

                </div>
            </template>

            <template if:false={hasData}>
                <template if:false={error}>
                    <p class="slds-text-color_weak slds-text-align_center slds-m-top_medium">Nessun dato presente per generare il grafico.</p>
                </template>
            </template>

        </div>
    </lightning-card>
</template>

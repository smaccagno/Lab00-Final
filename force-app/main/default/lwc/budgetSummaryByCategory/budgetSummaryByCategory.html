<template>
    <lightning-card title="Riepilogo Budget per Categoria" icon-name="custom:custom41">
        <div class="slds-p-around_medium">
            
            <template if:false={hideDateFilter}>
                <div class="date-filter-toolbar slds-m-bottom_medium">
                    <div class="date-filter-year">
                        <lightning-combobox
                            name="yearFilter"
                            variant="label-hidden"
                            value={selectedYear}
                            placeholder="Anno"
                            options={yearOptions}
                            onchange={handleYearChange}>
                        </lightning-combobox>
                    </div>
                    <div class="date-filter-input">
                        <label class="slds-form-element__label slds-text-title_bold" for="date-filter">Filtra per Data</label>
                        <lightning-input id="date-filter" type="date" variant="label-hidden" value={selectedDate} onchange={handleDateChange}></lightning-input>
                    </div>
                    <div class="date-filter-actions">
                        <template for:each={quickDateActions} for:item="action">
                            <button
                                key={action.key}
                                class="slds-button slds-button_neutral date-filter-button"
                                data-action={action.key}
                                onclick={handleQuickDateClick}>
                                {action.label}
                            </button>
                        </template>
                        <div class="date-filter-month">
                            <lightning-combobox
                                name="monthShortcut"
                                variant="label-hidden"
                                placeholder="Mese"
                                options={monthOptions}
                                onchange={handleMonthShortcutChange}>
                            </lightning-combobox>
                        </div>
                    </div>
                </div>
            </template>

            <template if:true={showQuickSummary}>
                <template if:true={quickSummary}>
                    <div class="quick-summary slds-m-bottom_medium">
                        <div class="quick-summary-grid">
                            <div class="quick-summary-section">
                                <div class="quick-summary-title">Totale Incassi (alla data {quickSummary.dateLabel})</div>
                                <div class="quick-summary-line">Previsti:
                                    <lightning-formatted-number value={quickSummary.incassiPrevisti} format-style="currency" currency-code="EUR"></lightning-formatted-number>
                                </div>
                                <div class="quick-summary-line">Effettivi:
                                    <lightning-formatted-number value={quickSummary.incassiEffettivi} format-style="currency" currency-code="EUR"></lightning-formatted-number>
                                </div>
                            </div>
                            <div class="quick-summary-section">
                                <div class="quick-summary-title">Totale Spese (alla data {quickSummary.dateLabel})</div>
                                <div class="quick-summary-line">Previste:
                                    <lightning-formatted-number value={quickSummary.spesePreviste} format-style="currency" currency-code="EUR"></lightning-formatted-number>
                                </div>
                                <div class="quick-summary-line">Effettive:
                                    <lightning-formatted-number value={quickSummary.speseEffettive} format-style="currency" currency-code="EUR"></lightning-formatted-number>
                                </div>
                            </div>
                            <div class="quick-summary-section">
                                <div class="quick-summary-title">Ammontare Disponibile (alla data {quickSummary.dateLabel})</div>
                                <div class="quick-summary-line">Previsto:
                                    <lightning-formatted-number value={quickSummary.disponibilePrevisto} format-style="currency" currency-code="EUR"></lightning-formatted-number>
                                </div>
                                <div class="quick-summary-line">Effettivo:
                                    <lightning-formatted-number value={quickSummary.disponibileEffettivo} format-style="currency" currency-code="EUR"></lightning-formatted-number>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
            </template>

            <template if:true={error}>
                <div class="slds-text-color_error">{error}</div>
            </template>

            <template if:true={showSkeleton}>
                <div class="chart-skeleton">
                    <div class="chart-skeleton-row chart-skeleton-row--title"></div>
                    <div class="chart-skeleton-row"></div>
                    <div class="chart-skeleton-row chart-skeleton-row--short"></div>
                    <div class="chart-skeleton-row"></div>
                    <div class="chart-skeleton-row chart-skeleton-row--short"></div>
                </div>
            </template>

            <template if:true={hasData}>
                <div class="chart-container">
                    <div class="bar-row progress-header-row">
                        <div class="bar-info"></div>
                        <div class="bar-track progress-header-track"></div>
                        <div class="bar-progress bar-progress-header">Avanzamento (Effettivi/Previsti)</div>
                    </div>
                    
                    <!-- Cash Flow Section -->
                    <template if:true={cashFlow.length}>
                        <h3 class="section-title section-title--cashflow slds-m-bottom_medium">
                            <lightning-icon icon-name="utility:moneybag" size="small" class="slds-m-right_xx-small"></lightning-icon>
                            <span>Cash Flow</span>
                        </h3>
                        
                        <template for:each={cashFlow} for:item="item">
                            <div key={item.categoria} class="bar-row-group">
                                <div class="bar-category-name" title={item.categoria}>{item.categoria}</div>
                                <div class={item.rowClass}>
                                <div class="bar-info" title={item.categoria}>
                                    <div class="bar-info-values">
                                        <span class="bar-info-prev">Previsto:&nbsp;<lightning-formatted-number value={item.previsto} format-style="currency" currency-code="EUR" maximum-fraction-digits="0"></lightning-formatted-number></span>
                                        <span class="bar-info-eff">Effettivo:&nbsp;<lightning-formatted-number value={item.effettivo} format-style="currency" currency-code="EUR" maximum-fraction-digits="0"></lightning-formatted-number></span>
                                    </div>
                                </div>
                                <div class="bar-track">
                                    <template for:each={item.segments} for:item="seg">
                                        <div key={seg.id} class={seg.cssClass} style={seg.style}
                                             data-title={seg.title} data-category={item.categoria} data-items={seg.itemsJson} data-scope="total"
                                             onmouseover={handleMouseOver} onmousemove={handleMouseMove} onmouseout={handleMouseOut} onclick={handleBarClick}>
                                            <span class={seg.labelClass}>
                                                <lightning-formatted-number value={seg.value} format-style="currency" currency-code="EUR" maximum-fraction-digits="0"></lightning-formatted-number>
                                            </span>
                                        </div>
                                    </template>
                                </div>
                                <div class="bar-progress">
                                    <lightning-formatted-number value={item.avanzamento} format-style="percent" minimum-fraction-digits="1" maximum-fraction-digits="1"></lightning-formatted-number>
                                </div>
                                </div>
                            </div>
                        </template>
                        
                        <div class="section-separator"></div>
                    </template>

                    <!-- Incassi Section -->
                    <template if:true={incassi.length}>
                        <h3 class="section-title section-title--incassi slds-m-bottom_medium">
                            <lightning-icon icon-name="utility:arrowup" size="small" variant="success" class="slds-m-right_xx-small"></lightning-icon>
                            <span>Incassi</span>
                            <span class="section-count-badge section-count-badge--incassi">{incassiCountLabel}</span>
                        </h3>
                        
                        <template for:each={incassi} for:item="item">
                            <div key={item.categoria} class="bar-row-group">
                                <div class="bar-category-name" title={item.categoria}>{item.categoria}</div>
                                <div class={item.rowClass}>
                                <div class="bar-info" title={item.categoria}>
                                    <div class="bar-info-values">
                                        <span class="bar-info-prev">Previsto:&nbsp;<lightning-formatted-number value={item.previsto} format-style="currency" currency-code="EUR" maximum-fraction-digits="0"></lightning-formatted-number></span>
                                        <span class="bar-info-eff">Effettivo:&nbsp;<lightning-formatted-number value={item.effettivo} format-style="currency" currency-code="EUR" maximum-fraction-digits="0"></lightning-formatted-number></span>
                                    </div>
                                </div>
                                <div class="bar-track">
                                    <template for:each={item.segments} for:item="seg">
                                        <div key={seg.id} class={seg.cssClass} style={seg.style}
                                             data-title={seg.title} data-category={item.categoria} data-items={seg.itemsJson} data-scope="category"
                                             onmouseover={handleMouseOver} onmousemove={handleMouseMove} onmouseout={handleMouseOut} onclick={handleBarClick}>
                                            <span class={seg.labelClass}>
                                                <lightning-formatted-number value={seg.value} format-style="currency" currency-code="EUR" maximum-fraction-digits="0"></lightning-formatted-number>
                                            </span>
                                        </div>
                                    </template>
                                </div>
                                <div class="bar-progress">
                                    <lightning-formatted-number value={item.avanzamento} format-style="percent" minimum-fraction-digits="1" maximum-fraction-digits="1"></lightning-formatted-number>
                                </div>
                                </div>
                            </div>
                        </template>
                    </template>

                    <!-- Spese Section -->
                    <template if:true={spese.length}>
                        <h3 class="section-title section-title--spese slds-m-top_large slds-m-bottom_medium">
                            <lightning-icon icon-name="utility:arrowdown" size="small" variant="error" class="slds-m-right_xx-small"></lightning-icon>
                            <span>Spese</span>
                            <span class="section-count-badge section-count-badge--spese">{speseCountLabel}</span>
                        </h3>
                        
                        <template for:each={spese} for:item="item">
                            <div key={item.categoria} class="bar-row-group">
                                <div class="bar-category-name" title={item.categoria}>{item.categoria}</div>
                                <div class={item.rowClass}>
                                <div class="bar-info" title={item.categoria}>
                                    <div class="bar-info-values">
                                        <span class="bar-info-prev">Previsto:&nbsp;<lightning-formatted-number value={item.previsto} format-style="currency" currency-code="EUR" maximum-fraction-digits="0"></lightning-formatted-number></span>
                                        <span class="bar-info-eff">Effettivo:&nbsp;<lightning-formatted-number value={item.effettivo} format-style="currency" currency-code="EUR" maximum-fraction-digits="0"></lightning-formatted-number></span>
                                    </div>
                                </div>
                                <div class="bar-track">
                                    <template for:each={item.segments} for:item="seg">
                                        <div key={seg.id} class={seg.cssClass} style={seg.style}
                                             data-title={seg.title} data-category={item.categoria} data-items={seg.itemsJson} data-scope="category"
                                             onmouseover={handleMouseOver} onmousemove={handleMouseMove} onmouseout={handleMouseOut} onclick={handleBarClick}>
                                            <span class={seg.labelClass}>
                                                <lightning-formatted-number value={seg.value} format-style="currency" currency-code="EUR" maximum-fraction-digits="0"></lightning-formatted-number>
                                            </span>
                                        </div>
                                    </template>
                                </div>
                                <div class="bar-progress">
                                    <lightning-formatted-number value={item.avanzamento} format-style="percent" minimum-fraction-digits="1" maximum-fraction-digits="1"></lightning-formatted-number>
                                </div>
                                </div>
                            </div>
                        </template>
                    </template>

                    <!-- Legenda -->
                    <div class="legend-container slds-m-top_large" role="list" aria-label="Legenda grafico">
                        <span class="legend-pill legend-pill--incasso-eff" role="listitem">Incassi Effettivi</span>
                        <span class="legend-pill legend-pill--incasso-prev" role="listitem">Incassi Previsti</span>
                        <span class="legend-pill legend-pill--spesa-eff" role="listitem">Spese Effettive</span>
                        <span class="legend-pill legend-pill--spesa-prev" role="listitem">Spese Previste</span>
                        <span class="legend-pill legend-pill--disp-eff" role="listitem">Disponibile Effettivo</span>
                        <span class="legend-pill legend-pill--disp-prev" role="listitem">Disponibile Previsto</span>
                    </div>

                </div>
            </template>

            <template if:false={hasData}>
                <template if:false={error}>
                    <p class="slds-text-color_weak slds-text-align_center slds-m-top_medium">Nessun dato presente per generare il grafico.</p>
                </template>
            </template>

            <!-- Tooltip -->
            <template if:true={tooltipVisible}>
                <div class="custom-tooltip" style={tooltipStyle}
                     onmouseenter={handleTooltipEnter}
                     onmouseleave={handleTooltipLeave}>
                    <div class="tooltip-title">{tooltipTitle}</div>
                    <ul class="tooltip-list">
                        <template for:each={tooltipItems} for:item="tItem" for:index="idx">
                            <li key={tItem._key} class="tooltip-list-item">
                                <template if:true={tItem.hasLink}>
                                    <a href={tItem.url}
                                       class="tooltip-item-label tooltip-item-link"
                                       title={tItem.label}
                                       data-record-id={tItem.recordId}
                                       onclick={handleTooltipItemClick}>{tItem.label}</a>
                                </template>
                                <template if:false={tItem.hasLink}>
                                    <span class="tooltip-item-label" title={tItem.label}>{tItem.label}</span>
                                </template>
                                <span class="tooltip-item-value">
                                    <lightning-formatted-number value={tItem.value} format-style="currency" currency-code="EUR"></lightning-formatted-number>
                                </span>
                            </li>
                        </template>
                    </ul>
                </div>
            </template>

            <!-- Modal Dettaglio -->
            <template if:true={modalVisible}>
                <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="bsc-modal-title" class="slds-modal slds-fade-in-open slds-modal_large">
                    <div class="slds-modal__container">
                        <header class="slds-modal__header">
                            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Chiudi" onclick={closeModal}>
                                <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                                <span class="slds-assistive-text">Chiudi</span>
                            </button>
                            <h2 id="bsc-modal-title" class="slds-modal__title slds-hyphenate">{modalTitle}</h2>
                        </header>
                        <div class="slds-modal__content slds-p-around_medium">
                            <lightning-datatable
                                key-field="_rowKey"
                                data={modalData}
                                columns={modalColumns}
                                onrowaction={handleModalRowAction}
                                hide-checkbox-column>
                            </lightning-datatable>
                        </div>
                        <footer class="slds-modal__footer">
                            <button class="slds-button slds-button_neutral" onclick={closeModal}>Chiudi</button>
                        </footer>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
            </template>

        </div>
    </lightning-card>
</template>

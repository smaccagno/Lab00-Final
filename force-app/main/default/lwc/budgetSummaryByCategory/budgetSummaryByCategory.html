<template>
    <lightning-card title="Riepilogo Budget per Categoria" icon-name="custom:custom41">
        <div class="slds-p-around_medium">
            
            <div class="slds-grid slds-gutters slds-m-bottom_medium">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                    <lightning-input type="date" label="Filtra per Data (solo voci Effettive)" value={selectedDate} onchange={handleDateChange}></lightning-input>
                </div>
            </div>

            <template if:true={error}>
                <div class="slds-text-color_error">{error}</div>
            </template>

            <template if:true={hasData}>
                <div class="chart-container">
                    
                    <!-- Cash Flow Section -->
                    <template if:true={cashFlow.length}>
                        <h3 class="slds-text-heading_small slds-m-bottom_medium slds-text-color_default">
                            <lightning-icon icon-name="utility:moneybag" size="small" class="slds-m-right_xx-small"></lightning-icon>
                            Cash Flow
                        </h3>
                        
                        <template for:each={cashFlow} for:item="item">
                            <div key={item.categoria} class="bar-row">
                                <div class="bar-label" title={item.categoria}>{item.categoria}</div>
                                <div class="bar-track">
                                    <template for:each={item.segments} for:item="seg">
                                        <div key={seg.id} class={seg.cssClass} style={seg.style} title={seg.title}>
                                            <span class="segment-label">
                                                <lightning-formatted-number value={seg.value} format-style="currency" currency-code="EUR" maximum-fraction-digits="0"></lightning-formatted-number>
                                            </span>
                                        </div>
                                    </template>
                                </div>
                                <div class="bar-value">
                                    <lightning-formatted-number value={item.totale} format-style="currency" currency-code="EUR"></lightning-formatted-number>
                                </div>
                            </div>
                        </template>
                        
                        <hr class="slds-m-vertical_large" />
                    </template>

                    <!-- Incassi Section -->
                    <template if:true={incassi.length}>
                        <h3 class="slds-text-heading_small slds-m-bottom_medium slds-text-color_success">
                            <lightning-icon icon-name="utility:arrowup" size="small" variant="success" class="slds-m-right_xx-small"></lightning-icon>
                            Incassi
                        </h3>
                        
                        <template for:each={incassi} for:item="item">
                            <div key={item.categoria} class="bar-row">
                                <div class="bar-label" title={item.categoria}>{item.categoria}</div>
                                <div class="bar-track">
                                    <template for:each={item.segments} for:item="seg">
                                        <div key={seg.id} class={seg.cssClass} style={seg.style} title={seg.title}>
                                            <span class="segment-label">
                                                <lightning-formatted-number value={seg.value} format-style="currency" currency-code="EUR" maximum-fraction-digits="0"></lightning-formatted-number>
                                            </span>
                                        </div>
                                    </template>
                                </div>
                                <div class="bar-value">
                                    <lightning-formatted-number value={item.totale} format-style="currency" currency-code="EUR"></lightning-formatted-number>
                                </div>
                            </div>
                        </template>
                    </template>

                    <!-- Spese Section -->
                    <template if:true={spese.length}>
                        <h3 class="slds-text-heading_small slds-m-top_large slds-m-bottom_medium slds-text-color_error">
                            <lightning-icon icon-name="utility:arrowdown" size="small" variant="error" class="slds-m-right_xx-small"></lightning-icon>
                            Spese
                        </h3>
                        
                        <template for:each={spese} for:item="item">
                            <div key={item.categoria} class="bar-row">
                                <div class="bar-label" title={item.categoria}>{item.categoria}</div>
                                <div class="bar-track">
                                    <template for:each={item.segments} for:item="seg">
                                        <div key={seg.id} class={seg.cssClass} style={seg.style} title={seg.title}>
                                            <span class="segment-label">
                                                <lightning-formatted-number value={seg.value} format-style="currency" currency-code="EUR" maximum-fraction-digits="0"></lightning-formatted-number>
                                            </span>
                                        </div>
                                    </template>
                                </div>
                                <div class="bar-value">
                                    <lightning-formatted-number value={item.totale} format-style="currency" currency-code="EUR"></lightning-formatted-number>
                                </div>
                            </div>
                        </template>
                    </template>

                    <!-- Legenda -->
                    <div class="legend-container slds-m-top_large">
                        <div class="legend-item">
                            <div class="legend-color bar-incasso-effettivo"></div>
                            <span>Incassi Effettivi</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color bar-incasso-previsto"></div>
                            <span>Incassi Previsti</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color bar-spesa-effettivo"></div>
                            <span>Spese Effettive</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color bar-spesa-previsto"></div>
                            <span>Spese Previste</span>
                        </div>
                    </div>

                </div>
            </template>

            <template if:false={hasData}>
                <template if:false={error}>
                    <p class="slds-text-color_weak slds-text-align_center slds-m-top_medium">Nessun dato presente per generare il grafico.</p>
                </template>
            </template>

        </div>
    </lightning-card>
</template>

<template>
    <div class="slds-grid slds-wrap slds-gutters slds-p-around_small">
        
        <!-- Global Date Filter -->
        <div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
            <lightning-card>
                <div class="slds-p-around_medium dashboard-date-toolbar">
                    <div class="dashboard-date-year">
                        <lightning-combobox
                            name="globalYearFilter"
                            variant="label-hidden"
                            value={selectedYear}
                            placeholder="Anno"
                            options={yearOptions}
                            onchange={handleYearChange}>
                        </lightning-combobox>
                    </div>
                    <div class="dashboard-date-input">
                        <label class="slds-form-element__label slds-text-title_bold" for="global-date-filter">Filtra per Data (Globale)</label>
                        <lightning-input id="global-date-filter" type="date" variant="label-hidden" value={globalDate} onchange={handleGlobalDateChange}></lightning-input>
                    </div>
                    <div class="dashboard-date-actions">
                        <template for:each={quickDateActions} for:item="action">
                            <button
                                key={action.key}
                                class="slds-button slds-button_neutral dashboard-date-button"
                                data-action={action.key}
                                onclick={handleQuickDateClick}>
                                {action.label}
                            </button>
                        </template>
                        <div class="dashboard-date-month">
                            <lightning-combobox
                                name="dashboardMonthShortcut"
                                variant="label-hidden"
                                placeholder="Mese"
                                options={monthOptions}
                                onchange={handleMonthShortcutChange}>
                            </lightning-combobox>
                        </div>
                    </div>
                </div>
            </lightning-card>
        </div>

        <!-- Accordion wrapping overall and per-program sections -->
        <div class="slds-col slds-size_1-of-1">
            <lightning-accordion allow-multiple-sections-open active-section-name={activeAccordionSections} onsectiontoggle={handleAccordionToggle}>
                <lightning-accordion-section name="overview" label="Vista Omnicomprensiva">
                    <template if:true={accountId}>
                        <c-budget-summary-by-category
                            record-id={accountId}
                            filter-date={globalDate}
                            hide-date-filter="true"
                            show-quick-summary="true">
                        </c-budget-summary-by-category>
                    </template>
                </lightning-accordion-section>

                <lightning-accordion-section name="programs" label="Dettaglio per Programma">
                    <div class="slds-p-around_small">
                    <!-- Program switcher buttons -->
                    <div class="program-switcher slds-m-bottom_medium">
                        <template for:each={programButtons} for:item="prog">
                            <button
                                key={prog.Id}
                                class={prog.buttonClass}
                                data-program-id={prog.Id}
                                onclick={handleProgramButtonClick}>
                                {prog.DisplayName}
                            </button>
                        </template>
                    </div>

                    <template if:true={hasProgramSelection}>
                        <div class="program-detail-grid">
                            <!-- Chart side -->
                            <div class="program-detail-chart">
                                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_small">
                                    <h3 class="slds-text-heading_small slds-text-title_bold">{selectedProgramName}</h3>
                                    <button
                                        class="slds-button slds-button_neutral"
                                        data-program-id={selectedProgramId}
                                        onclick={handleGoToProgramBudget}>
                                        {selectedProgramButtonLabel}
                                    </button>
                                </div>
                                <template if:true={programScaleReady}>
                                    <c-budget-summary-by-category
                                        record-id={selectedProgramId}
                                        filter-date={globalDate}
                                        hide-date-filter="true"
                                        show-quick-summary="true"
                                        external-max-categories-val={globalProgramCategoriesMaxVal}
                                        external-max-cash-flow-val={globalProgramCashFlowMaxVal}>
                                    </c-budget-summary-by-category>
                                </template>
                            </div>

                            <!-- Table side -->
                            <div class="program-detail-table">
                                <template if:true={programSummaryData}>
                                    <div class="slds-m-bottom_large slds-box slds-theme_default">
                                        <h3 class="slds-text-heading_small slds-m-bottom_small slds-text-title_bold slds-text-color_default">{programSummaryTitle}</h3>
                                        <lightning-datatable
                                            key-field="id"
                                            data={programSummaryData}
                                            columns={columns}
                                            hide-checkbox-column>
                                        </lightning-datatable>
                                    </div>
                                </template>

                                <template if:true={yearlyData}>
                                    <template for:each={yearlyData} for:item="yearGroup">
                                        <div key={yearGroup.anno} class="slds-m-bottom_large">
                                            <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_small">
                                                <h3 class="slds-text-heading_small slds-text-title_bold slds-text-color_default">Anno: {yearGroup.anno}</h3>
                                                <button
                                                    class="slds-button slds-button_neutral slds-m-left_small"
                                                    data-budget-year-id={yearGroup.budgetYearId}
                                                    onclick={handleGoToYearBudget}
                                                    disabled={yearGroup.disableNavigate}>
                                                    {yearGroup.navigateLabel}
                                                </button>
                                            </div>
                                            <lightning-datatable
                                                key-field="id"
                                                data={yearGroup.data}
                                                columns={columns}
                                                hide-checkbox-column>
                                            </lightning-datatable>
                                        </div>
                                    </template>
                                </template>
                                <template if:false={yearlyData}>
                                    <p class="slds-m-top_medium slds-text-color_weak">Nessun dato disponibile per i filtri selezionati.</p>
                                </template>
                            </div>
                        </div>
                    </template>
                    <template if:false={hasProgramSelection}>
                        <p class="slds-text-color_weak">Seleziona un programma per visualizzare grafico e dettaglio tabellare.</p>
                    </template>
                    </div>
                </lightning-accordion-section>
            </lightning-accordion>
        </div>
    </div>
</template>

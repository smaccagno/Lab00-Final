<template>
    <div class="slds-grid slds-wrap slds-gutters slds-p-around_small">
        
        <!-- Global Date Filter -->
        <div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
            <div class="dashboard-hero">
                <div class="dashboard-hero-header">
                    <div class="dashboard-hero-title">
                        <lightning-icon icon-name="utility:knowledge_base" size="small" class="dashboard-hero-icon"></lightning-icon>
                        <h1>Budget Dashboard</h1>
                    </div>
                    <div class="dashboard-hero-date">
                        <lightning-icon icon-name="utility:event" size="xx-small" alternative-text="Data"></lightning-icon>
                        <span>Situazione al <strong>{formattedGlobalDate}</strong></span>
                    </div>
                </div>

                <div class="dashboard-date-toolbar">
                    <div class="dashboard-date-year">
                        <lightning-combobox
                            name="globalYearFilter"
                            variant="label-hidden"
                            value={selectedYear}
                            placeholder="Anno"
                            options={yearOptions}
                            onchange={handleYearChange}>
                        </lightning-combobox>
                    </div>
                    <div class="dashboard-date-input">
                        <label class="slds-form-element__label slds-text-title_bold" for="global-date-filter">Filtra per Data (Globale)</label>
                        <lightning-input id="global-date-filter" type="date" variant="label-hidden" value={globalDate} onchange={handleGlobalDateChange}></lightning-input>
                    </div>
                    <div class="dashboard-date-actions">
                        <template for:each={quickDateActions} for:item="action">
                            <button
                                key={action.key}
                                class={action.buttonClass}
                                data-action={action.key}
                                onclick={handleQuickDateClick}>
                                {action.label}
                            </button>
                        </template>
                        <div class="dashboard-date-month">
                            <lightning-combobox
                                name="dashboardMonthShortcut"
                                variant="label-hidden"
                                placeholder="Mese"
                                options={monthOptions}
                                onchange={handleMonthShortcutChange}>
                            </lightning-combobox>
                        </div>
                    </div>
                </div>

                <template if:true={hasActiveChips}>
                    <div class="dashboard-chip-row" role="list" aria-label="Filtri attivi">
                        <span class="dashboard-chip-intro">Filtri attivi:</span>
                        <template for:each={activeChips} for:item="chip">
                            <span key={chip.key} class="dashboard-chip" role="listitem">
                                <span class="dashboard-chip-label">{chip.label}</span>
                                <template if:true={chip.removable}>
                                    <button
                                        class="dashboard-chip-remove"
                                        data-chip={chip.key}
                                        title="Rimuovi filtro"
                                        onclick={handleChipRemove}>
                                        <lightning-icon icon-name="utility:close" size="xx-small" alternative-text="Rimuovi"></lightning-icon>
                                    </button>
                                </template>
                            </span>
                        </template>
                    </div>
                </template>
            </div>
        </div>

        <!-- KPI cards -->
        <template if:true={accountId}>
            <div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
                <c-budget-kpi-cards account-id={accountId} filter-date={globalDate}></c-budget-kpi-cards>
            </div>
        </template>

        <!-- Accordion wrapping overall and per-program sections -->
        <div class="slds-col slds-size_1-of-1 dashboard-accordion">
            <lightning-accordion allow-multiple-sections-open active-section-name={activeAccordionSections} onsectiontoggle={handleAccordionToggle}>
                <lightning-accordion-section name="overview" label="Vista Omnicomprensiva">
                    <template if:true={accountId}>
                        <c-budget-summary-by-category
                            record-id={accountId}
                            filter-date={globalDate}
                            hide-date-filter="true"
                            show-quick-summary="true">
                        </c-budget-summary-by-category>
                    </template>
                </lightning-accordion-section>

                <lightning-accordion-section name="programs" label="Dettaglio per Programma">
                    <div class="slds-p-around_small">
                    <!-- Date filter (sync with top) -->
                    <div class="dashboard-date-toolbar slds-m-bottom_medium">
                        <div class="dashboard-date-year">
                            <lightning-combobox
                                name="programsYearFilter"
                                variant="label-hidden"
                                value={selectedYear}
                                placeholder="Anno"
                                options={yearOptions}
                                onchange={handleYearChange}>
                            </lightning-combobox>
                        </div>
                        <div class="dashboard-date-input">
                            <label class="slds-form-element__label slds-text-title_bold" for="programs-date-filter">Filtra per Data (Globale)</label>
                            <lightning-input id="programs-date-filter" type="date" variant="label-hidden" value={globalDate} onchange={handleGlobalDateChange}></lightning-input>
                        </div>
                        <div class="dashboard-date-actions">
                            <template for:each={quickDateActions} for:item="action">
                                <button
                                    key={action.key}
                                    class={action.buttonClass}
                                    data-action={action.key}
                                    onclick={handleQuickDateClick}>
                                    {action.label}
                                </button>
                            </template>
                            <div class="dashboard-date-month">
                                <lightning-combobox
                                    name="programsMonthShortcut"
                                    variant="label-hidden"
                                    placeholder="Mese"
                                    options={monthOptions}
                                    onchange={handleMonthShortcutChange}>
                                </lightning-combobox>
                            </div>
                        </div>
                    </div>

                    <!-- Program switcher buttons -->
                    <div class="program-switcher slds-m-bottom_medium">
                        <template for:each={programButtons} for:item="prog">
                            <button
                                key={prog.Id}
                                class={prog.buttonClass}
                                data-program-id={prog.Id}
                                onclick={handleProgramButtonClick}>
                                {prog.DisplayName}
                            </button>
                        </template>
                    </div>

                    <template if:true={hasProgramSelection}>
                        <div class="program-detail-grid">
                            <!-- Chart side -->
                            <div class="program-detail-chart">
                                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_small">
                                    <h3 class="slds-text-heading_small slds-text-title_bold">{selectedProgramName}</h3>
                                    <button
                                        class="slds-button slds-button_neutral"
                                        data-program-id={selectedProgramId}
                                        onclick={handleGoToProgramBudget}>
                                        {selectedProgramButtonLabel}
                                    </button>
                                </div>
                                <template if:true={programScaleReady}>
                                    <c-budget-summary-by-category
                                        record-id={selectedProgramId}
                                        filter-date={globalDate}
                                        hide-date-filter="true"
                                        show-quick-summary="true"
                                        external-max-categories-val={globalProgramCategoriesMaxVal}
                                        external-max-cash-flow-val={globalProgramCashFlowMaxVal}>
                                    </c-budget-summary-by-category>
                                </template>
                            </div>

                            <!-- Table side -->
                            <div class="program-detail-table">
                                <template if:true={programSummaryData}>
                                    <div class="slds-m-bottom_large slds-box slds-theme_default">
                                        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_small">
                                            <h3 class="slds-text-heading_small slds-text-title_bold slds-text-color_default">{programSummaryTitle}</h3>
                                            <button
                                                class="slds-button slds-button_neutral"
                                                onclick={handleOpenRecordsViewerAllYears}>
                                                Vedi tutti i record
                                            </button>
                                        </div>
                                        <lightning-datatable
                                            key-field="id"
                                            data={programSummaryData}
                                            columns={columns}
                                            hide-checkbox-column>
                                        </lightning-datatable>
                                    </div>
                                </template>

                                <template if:true={yearlyData}>
                                    <template for:each={yearlyData} for:item="yearGroup">
                                        <div key={yearGroup.anno} class="slds-m-bottom_large">
                                            <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_small">
                                                <h3 class="slds-text-heading_small slds-text-title_bold slds-text-color_default">{yearGroup.label}</h3>
                                                <div class="slds-grid slds-gutters_xx-small">
                                                    <button
                                                        class="slds-button slds-button_neutral slds-m-left_small"
                                                        data-anno={yearGroup.anno}
                                                        onclick={handleOpenRecordsViewerYear}>
                                                        Vedi tutti i record
                                                    </button>
                                                    <button
                                                        class="slds-button slds-button_neutral slds-m-left_small"
                                                        data-budget-year-id={yearGroup.budgetYearId}
                                                        onclick={handleGoToYearBudget}
                                                        disabled={yearGroup.disableNavigate}>
                                                        {yearGroup.navigateLabel}
                                                    </button>
                                                </div>
                                            </div>
                                            <lightning-datatable
                                                key-field="id"
                                                data={yearGroup.data}
                                                columns={columns}
                                                hide-checkbox-column>
                                            </lightning-datatable>
                                        </div>
                                    </template>
                                </template>
                                <template if:false={yearlyData}>
                                    <p class="slds-m-top_medium slds-text-color_weak">Nessun dato disponibile per i filtri selezionati.</p>
                                </template>
                            </div>
                        </div>
                    </template>
                    <template if:false={hasProgramSelection}>
                        <p class="slds-text-color_weak">Seleziona un programma per visualizzare grafico e dettaglio tabellare.</p>
                    </template>
                    </div>
                </lightning-accordion-section>
            </lightning-accordion>
        </div>
    </div>
</template>

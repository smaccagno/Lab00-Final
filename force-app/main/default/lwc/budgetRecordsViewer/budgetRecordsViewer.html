<template>
    <lightning-card title="Dettaglio Voci di Budget" icon-name="standard:financial_account">

        <template if:true={loading}>
            <lightning-spinner alternative-text="Caricamento" size="small"></lightning-spinner>
        </template>

        <template if:true={error}>
            <div class="slds-p-around_medium slds-text-color_error">{error}</div>
        </template>

        <div class="viewer-layout">
            <!-- Sidebar filtri -->
            <aside class="viewer-sidebar" aria-label="Filtri">
                <div class="viewer-sidebar-header">
                    <lightning-icon icon-name="utility:filterList" size="small" class="viewer-sidebar-icon"></lightning-icon>
                    <span>Filtri</span>
                </div>

                <lightning-combobox
                    label="Programma"
                    value={programId}
                    options={programOptions}
                    onchange={handleProgramChange}>
                </lightning-combobox>
                <lightning-combobox
                    label="Anno"
                    value={anno}
                    options={annoOptions}
                    onchange={handleAnnoChange}>
                </lightning-combobox>
                <lightning-combobox
                    label="Tipo"
                    value={tipo}
                    options={tipoOptions}
                    onchange={handleTipoChange}>
                </lightning-combobox>
                <lightning-combobox
                    label="Categoria"
                    value={categoria}
                    options={categoriaOptions}
                    onchange={handleCategoriaChange}>
                </lightning-combobox>
                <lightning-combobox
                    label="Sottocategoria"
                    value={sottocategoria}
                    options={sottocategoriaOptions}
                    disabled={sottocategoriaDisabled}
                    onchange={handleSottocategoriaChange}>
                </lightning-combobox>
                <lightning-input
                    type="date"
                    label="Filtra per data (≤)"
                    value={filterDate}
                    onchange={handleDateChange}>
                </lightning-input>

                <template if:true={hasActiveFilters}>
                    <lightning-button
                        label="Reset filtri"
                        onclick={handleResetFilters}
                        variant="neutral"
                        class="viewer-sidebar-reset">
                    </lightning-button>
                </template>
            </aside>

            <!-- Main area -->
            <section class="viewer-main">
                <!-- Breadcrumb -->
                <nav class="viewer-breadcrumb" aria-label="Filtri attivi">
                    <template for:each={breadcrumbItems} for:item="bc">
                        <span key={bc.key} class="viewer-breadcrumb-item">
                            <span class="viewer-breadcrumb-label">{bc.label}</span>
                            <template if:false={bc.isLast}>
                                <span class="viewer-breadcrumb-separator" aria-hidden="true">›</span>
                            </template>
                        </span>
                    </template>
                </nav>

                <!-- Avviso risultato troncato -->
                <template if:true={truncated}>
                    <div class="viewer-truncated-banner" role="status">
                        <lightning-icon icon-name="utility:warning" size="x-small" alternative-text="Avviso" class="viewer-truncated-icon"></lightning-icon>
                        <span>{truncatedMessage}</span>
                    </div>
                </template>

                <!-- Totali sticky (collapses to header + cashflow on scroll) -->
                <template if:true={hasTotals}>
                    <div class="viewer-totals-sentinel" aria-hidden="true"></div>
                    <div class={totalsContainerClass}>
                        <div class="viewer-totals-header">
                            <lightning-icon icon-name="utility:chart" size="x-small" class="viewer-totals-icon"></lightning-icon>
                            <h2 class="viewer-totals-title">Totali per Tipo e Categoria</h2>
                        </div>
                        <div class="rv-sheet-wrapper">
                            <table class="rv-sheet rv-sheet--totals">
                                <thead>
                                    <tr>
                                        <th class="col-type">Tipo</th>
                                        <th class="col-cat">Categoria</th>
                                        <th class="col-num">Previsto</th>
                                        <th class="col-num">Effettivo</th>
                                        <th class="col-progress">Avanzamento</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={displayTotals} for:item="row">
                                        <tr key={row.id} class={row.rowClass}>
                                            <td class="col-type"><span class={row.pillClass}>{row.typeLabel}</span></td>
                                            <td class="col-cat">{row.categoria}</td>
                                            <td class="col-num">{row.previstoFmt}</td>
                                            <td class="col-num">{row.effettivoFmt}</td>
                                            <td class="col-progress">
                                                <div class="rv-progress">
                                                    <span class="rv-progress-track">
                                                        <span class={row.progressFillClass} style={row.progressStyle}></span>
                                                    </span>
                                                    <span class="rv-progress-label">{row.avanzamentoFmt}</span>
                                                </div>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </template>

                <!-- Table header -->
                <div class="viewer-table-header">
                    <h2 class="viewer-table-title">{recordsCountLabel}</h2>
                    <template if:true={hasRecords}>
                        <c-export-to-excel
                            json-data={exportData}
                            file-name={exportFileName}
                            button-label="Esporta in Excel"
                            variant="brand">
                        </c-export-to-excel>
                    </template>
                </div>

                <!-- Table or empty -->
                <template if:true={hasRecords}>
                    <div class="viewer-table-wrapper">
                        <table class="rv-sheet rv-sheet--records">
                            <thead>
                                <tr>
                                    <template if:true={showTipoColumn}>
                                        <th class="col-type">Tipo</th>
                                    </template>
                                    <th class="col-name">Nome</th>
                                    <th class="col-prog">Programma</th>
                                    <th class="col-year">Anno</th>
                                    <th class="col-date">Data</th>
                                    <th class="col-cat">Categoria</th>
                                    <template if:true={showSottocategoriaColumn}>
                                        <th class="col-sub">Sottocategoria</th>
                                    </template>
                                    <template if:true={showNoteColumn}>
                                        <th class="col-note">Note</th>
                                    </template>
                                    <th class="col-status">Stato</th>
                                    <th class="col-num">Ammontare</th>
                                    <template if:true={showTransazioneColumn}>
                                        <th class="col-trans">Transazione</th>
                                    </template>
                                    <th class="col-bya">Budget Anno</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={displayRecords} for:item="row">
                                    <tr key={row.recordId} class="rv-row">
                                        <template if:true={showTipoColumn}>
                                            <td class="col-type"><span class={row.tipoPillClass}>{row.tipoLabel}</span></td>
                                        </template>
                                        <td class="col-name">
                                            <template if:true={row.canOpenRecord}>
                                                <button class="rv-link"
                                                        data-record-id={row.recordId}
                                                        data-tipo={row.tipo}
                                                        onclick={handleOpenRecord}
                                                        title={row.name}>{row.name}</button>
                                            </template>
                                            <template if:false={row.canOpenRecord}>
                                                <span class="rv-muted">{row.name}</span>
                                            </template>
                                        </td>
                                        <td class="col-prog">
                                            <template if:true={row.canOpenProgram}>
                                                <button class="rv-link"
                                                        data-program-id={row.programId}
                                                        onclick={handleOpenProgram}
                                                        title={row.programName}>{row.programName}</button>
                                            </template>
                                            <template if:false={row.canOpenProgram}>
                                                <span class="rv-muted">{row.programName}</span>
                                            </template>
                                        </td>
                                        <td class="col-year">{row.anno}</td>
                                        <td class="col-date">{row.dataFormatted}</td>
                                        <td class="col-cat">{row.categoria}</td>
                                        <template if:true={showSottocategoriaColumn}>
                                            <td class="col-sub">{row.sottocategoria}</td>
                                        </template>
                                        <template if:true={showNoteColumn}>
                                            <td class="col-note">{row.note}</td>
                                        </template>
                                        <td class="col-status"><span class={row.statoPillClass}>{row.statoLabel}</span></td>
                                        <td class={row.amountClass}>{row.ammontareFormatted}</td>
                                        <template if:true={showTransazioneColumn}>
                                            <td class="col-trans">
                                                <template if:true={row.canOpenTransazione}>
                                                    <button class="rv-link"
                                                            data-transazione-id={row.transazioneId}
                                                            onclick={handleOpenTransazione}
                                                            title={row.transazioneName}>{row.transazioneName}</button>
                                                </template>
                                                <template if:false={row.canOpenTransazione}>
                                                    <span class="rv-muted">{row.transazioneName}</span>
                                                </template>
                                            </td>
                                        </template>
                                        <td class="col-bya">{row.budgetYearName}</td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </template>
                <template if:false={hasRecords}>
                    <div class="viewer-empty-state">
                        <lightning-icon icon-name="utility:search" size="large" class="viewer-empty-icon"></lightning-icon>
                        <p class="viewer-empty-title">Nessun record trovato</p>
                        <template if:true={hasActiveFilters}>
                            <p class="viewer-empty-hint">Prova a rimuovere uno o più filtri per vedere più risultati.</p>
                            <lightning-button
                                label="Reset filtri"
                                onclick={handleResetFilters}
                                variant="brand">
                            </lightning-button>
                        </template>
                        <template if:false={hasActiveFilters}>
                            <p class="viewer-empty-hint">Non ci sono voci registrate per questo partner.</p>
                        </template>
                    </div>
                </template>
            </section>
        </div>
    </lightning-card>
</template>
